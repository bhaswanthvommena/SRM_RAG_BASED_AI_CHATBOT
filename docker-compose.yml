services:
  db:
    image: pgvector/pgvector:pg16
    container_name: srmap-rag-db
    environment:
      POSTGRES_USER: srmap
      POSTGRES_PASSWORD: srmap
      POSTGRES_DB: srmap_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srmap -d srmap_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
